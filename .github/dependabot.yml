# Weekly dependency updates. Every update PR runs the tests and the e-invoice validation (einvoice-check.yml).
# The validation rules and the Mustang validator are not covered here; see rules-update-check.yml.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # These must always have exactly the same version, otherwise Qt does not start
      # Dependabot compares normalized names (lowercase, "-" instead of "_"): pyside6-addons, pyside6-essentials
      pyside6:
        patterns: ["pyside6", "pyside6-addons", "pyside6-essentials", "shiboken6"]
      python-packages:
        patterns: ["*"]
        exclude-patterns: ["pyside6", "pyside6-addons", "pyside6-essentials", "shiboken6"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
