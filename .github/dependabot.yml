# Weekly dependency updates. Every update PR runs the tests and the e-invoice validation (einvoice-check.yml).
# The validation rules and the Mustang validator are not covered here; see rules-update-check.yml.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # These must always have exactly the same version, otherwise Qt does not start
      # Dependabot matched "PySide6" but not "PySide6_Addons" (it normalizes to pyside6-addons), so both spellings
      pyside6:
        patterns: ["pyside6", "pyside6-addons", "pyside6_addons", "pyside6-essentials", "pyside6_essentials", "shiboken6"]
      python-packages:
        patterns: ["*"]
        exclude-patterns: ["pyside6", "pyside6-addons", "pyside6_addons", "pyside6-essentials", "pyside6_essentials", "shiboken6"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
