# TEMPORARY diagnostics branch (not for merging): finds the crash at interpreter exit on Windows
name: Release

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -q -r requirements-dev.txt
      - name: Einzeltests
        run: |
          python -c "from saxonche import PySaxonProcessor; p = PySaxonProcessor(license=False); x = p.new_xslt30_processor()"
          echo SAXON_ONLY exit %errorlevel%
          python -c "from src.utils.einvoice_validation import validate_en16931, _processor; _processor()"
          echo SAXON_SCHALK exit %errorlevel%
          python -c "from PySide6.QtWidgets import QApplication; app = QApplication([])"
          echo QAPP_ONLY exit %errorlevel%
          python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); from saxonche import PySaxonProcessor; p = PySaxonProcessor(license=False)"
          echo QAPP_SAXON exit %errorlevel%
          python -m pytest -q tests/test_einvoice_compliance.py
          echo PYTEST_COMPLIANCE exit %errorlevel%
          python -m pytest -q tests/test_cashbook_and_storage.py
          echo PYTEST_STORAGE exit %errorlevel%
          python -m pytest -q tests/test_ui.py
          echo PYTEST_UI exit %errorlevel%
          python -m pytest -q tests/test_sorting.py
          echo PYTEST_SORTING exit %errorlevel%
          exit /b 0
