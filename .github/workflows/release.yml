# TEMPORARY diagnostics branch (not for merging): finds the crash at interpreter exit on Windows
name: Release

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -q -r requirements-dev.txt
      - name: Kombinationen
        run: |
          python -X faulthandler -m pytest -q -p no:faulthandler tests
          echo FULL exit %errorlevel%
          python -m pytest -q tests/test_ui.py tests/test_invoice_status.py tests/test_customer_dropdown.py tests/test_item_rows.py tests/test_scrollbars.py
          echo UI_GROUP exit %errorlevel%
          python -m pytest -q tests/test_editor_customer.py tests/test_items_required.py tests/test_quote_rocket.py tests/test_settings_tabs.py tests/test_german_texts.py tests/test_file_dialogs.py tests/test_upload_types.py tests/test_cashbook_finalize.py
          echo UI_GROUP2 exit %errorlevel%
          python -m pytest -q tests/test_invoices.py tests/test_einvoice_compliance.py tests/test_cashbook_and_storage.py tests/test_backup.py tests/test_sorting.py
          echo NON_UI exit %errorlevel%
          exit /b 0
