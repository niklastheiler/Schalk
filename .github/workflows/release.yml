# Builds Schalk.exe on Windows and publishes a GitHub release.
# Started by pushing a version tag (e.g. v1.0) or manually ("Run workflow"); a manual run
# releases the version from src/version.py and creates its tag on the current commit.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Tests and the independent Mustang validation of all tax cases; nothing is built or published if it fails
  check:
    uses: ./.github/workflows/einvoice-check.yml

  release:
    needs: check
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Version prüfen
        shell: pwsh
        run: |
          $version = (Select-String -Path src/version.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = if ("${{ github.event_name }}" -eq "push") { "${{ github.ref_name }}" } else { "v$version" }
          if ($tag -ne "v$version") {
            throw "Tag $tag passt nicht zu APP_VERSION $version in src/version.py"
          }
          "TAG=$tag" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Tests und EXE bauen
        shell: cmd
        run: build.bat

      - name: ZIP und Release-Text erstellen
        shell: pwsh
        run: |
          # The official validation rules must be part of the EXE, otherwise the XRechnung export fails
          foreach ($rules in "en16931/EN16931-CII-validation.xslt", "xrechnung/XRechnung-CII-validation.xslt") {
            if (-not (Test-Path "dist/Schalk/_internal/src/resources/$rules")) { throw "Prüfregeln fehlen in der EXE: $rules" }
          }
          Copy-Item LICENSE dist/Schalk/LICENSE.txt
          Compress-Archive -Path dist/Schalk -DestinationPath "Schalk-$env:TAG-windows-x64.zip"
          # Section of this version from CHANGELOG.md (from "## <version>" up to the next "## ")
          $version = $env:TAG.TrimStart("v")
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [array]::IndexOf($lines, "## $version")
          if ($start -lt 0) { throw "CHANGELOG.md enthält keinen Abschnitt '## $version'" }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) { if ($lines[$i].StartsWith("## ")) { $end = $i; break } }
          $lines[($start + 1)..($end - 1)] | Set-Content release-notes.md -Encoding utf8

      # Runs on other branches only build and test (to try out the workflow), nothing is published
      - uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Schalk ${{ env.TAG }}
          body_path: release-notes.md
          files: Schalk-${{ env.TAG }}-windows-x64.zip
