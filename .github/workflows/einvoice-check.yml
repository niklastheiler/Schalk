# Quality gate of every pull request, of every push to main and of every release:
# - quality: lint (pyflakes), static security analysis (bandit) and known vulnerabilities of all pinned
#   dependencies (pip-audit against the PyPI/OSV advisories)
# - check: the tests and the e-invoices of every tax case with the independent Mustang validator
#   (ZUGFeRD XML and profile, PDF/A-3 via veraPDF, XRechnung)
name: E-Rechnung prüfen

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs this check first and only publishes when it passes
  workflow_call:

permissions:
  contents: read

env:
  MUSTANG_VERSION: "2.26.0"
  MUSTANG_SHA1: "8755fc333032f802ad7dcf3930201edfe64014e2"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Only analyses the source code (nothing of Schalk runs here), so a Linux runner is enough
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Prüfwerkzeuge installieren
        run: python -m pip install -r requirements-ci.txt

      - name: Lint (pyflakes)
        run: python -m pyflakes src tools tests run.py

      - name: Statische Sicherheitsanalyse (bandit, ab mittlerem Schweregrad)
        run: python -m bandit -q -ll -r src tools run.py

      - name: Bekannte Sicherheitslücken in den Abhängigkeiten (pip-audit)
        # All versions are pinned, so the advisories are looked up without installing (pywin32 needs Windows)
        run: python -m pip_audit --no-deps --disable-pip -r requirements-dev.txt -r requirements-ci.txt

  check:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    # Python steps run in cmd like build.bat: PowerShell on GitHub stops on any stderr output
    # (e.g. Qt messages at exit) and would fail the step although the command succeeded
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Beispielrechnungen erzeugen
        run: python tools/create_sample_invoices.py check

      - name: Mustang-Validator laden
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://repo1.maven.org/maven2/org/mustangproject/Mustang-CLI/$env:MUSTANG_VERSION/Mustang-CLI-$env:MUSTANG_VERSION.jar"
          Invoke-WebRequest $url -OutFile mustang.jar
          $hash = (Get-FileHash mustang.jar -Algorithm SHA1).Hash.ToLower()
          if ($hash -ne $env:MUSTANG_SHA1) { throw "Prüfsumme des Mustang-Validators stimmt nicht: $hash" }

      - name: Rechnungen validieren
        shell: pwsh
        run: |
          # Java writes log lines to stderr; only the report decides
          $ErrorActionPreference = "Continue"
          $failed = @()
          foreach ($file in Get-ChildItem check -File | Where-Object { $_.Extension -in ".pdf", ".xml" }) {
            $report = java -jar mustang.jar --action validate --no-notices --source $file.FullName 2>&1 | Out-String
            Set-Content "check/$($file.BaseName).report.xml" $report -Encoding utf8
            if ($report -match '<summary status="valid"') {
              Write-Host "OK      $($file.Name)"
            } else {
              Write-Host "FEHLER  $($file.Name)"
              Write-Host $report
              $failed += $file.Name
            }
          }
          if ($failed) { throw "Nicht gültig: $($failed -join ', ')" }

      - name: Rechnungen und Prüfberichte bereitstellen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e-rechnungen-pruefung
          path: check/
